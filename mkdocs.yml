theme:
  name: material
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    logo: material/server-network
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
          site_description: Inferencia de LLM compatible con OpenAI y Anthropic en Apple Silicon
          nav:
            - Inicio: index.md
            - Primeros pasos:
                - Instalación: getting-started/installation.md
                - Inicio rápido: getting-started/quickstart.md
            - Usar vllm-mlx:
                - Servidor: guides/server.md
                - API de Python: guides/python-api.md
                - Lotes continuos: guides/continuous-batching.md
                - Multimodal: guides/multimodal.md
                - Audio: guides/audio.md
                - Embeddings: guides/embeddings.md
                - Razonamiento: guides/reasoning.md
                - Llamadas a herramientas: guides/tool-calling.md
                - Herramientas MCP: guides/mcp-tools.md
                - Top-k de MoE: guides/moe-top-k.md
                - Prompts calientes: guides/warm-prompts.md
                - Rendimiento:
                    - Resumen: benchmarks/README.md
                    - Modelos de lenguaje: benchmarks/llm.md
                    - Imágenes: benchmarks/image.md
                    - Audio: benchmarks/audio.md
                    - Video: benchmarks/video.md
            - Referencia:
                - CLI: reference/cli.md
                - Configuración: reference/configuration.md
                - Modelos compatibles: reference/models.md
        - locale: fr
          name: Français
          build: true
          site_description: Inférence LLM compatible avec OpenAI et Anthropic sur Apple Silicon
          nav:
            - Accueil: index.md
            - Bien démarrer:
                - Installation: getting-started/installation.md
                - Démarrage rapide: getting-started/quickstart.md
            - Utiliser vllm-mlx:
                - Serveur: guides/server.md
                - API Python: guides/python-api.md
                - Traitement continu: guides/continuous-batching.md
                - Multimodal: guides/multimodal.md
                - Audio: guides/audio.md
                - Embeddings: guides/embeddings.md
                - Raisonnement: guides/reasoning.md
                - Appel d'outils: guides/tool-calling.md
                - Outils MCP: guides/mcp-tools.md
                - Top-k MoE: guides/moe-top-k.md
                - Prompts préchargés: guides/warm-prompts.md
                - Performances:
                    - Vue d'ensemble: benchmarks/README.md
                    - Modèles de langage: benchmarks/llm.md
                    - Images: benchmarks/image.md
                    - Audio: benchmarks/audio.md
                    - Vidéo: benchmarks/video.md
            - Référence:
                - CLI: reference/cli.md
                - Configuration: reference/configuration.md
                - Modèles pris en charge: reference/models.md
        - locale: zh
          name: 中文
          build: true
          site_description: 在 Apple Silicon 上兼容 OpenAI 和 Anthropic 的 LLM 推理
          nav:
            - 首页: index.md
            - 入门:
                - 安装: getting-started/installation.md
                - 快速开始: getting-started/quickstart.md
            - 使用 vllm-mlx:
                - 服务器: guides/server.md
                - Python API: guides/python-api.md
                - 连续批处理: guides/continuous-batching.md
                - 多模态: guides/multimodal.md
                - 音频: guides/audio.md
                - 嵌入: guides/embeddings.md
                - 推理: guides/reasoning.md
                - 工具调用: guides/tool-calling.md
                - MCP 工具: guides/mcp-tools.md
                - MoE top-k: guides/moe-top-k.md
                - 预热提示: guides/warm-prompts.md
                - 性能:
                    - 概览: benchmarks/README.md
                    - 语言模型: benchmarks/llm.md
                    - 图像: benchmarks/image.md
                    - 音频: benchmarks/audio.md
                    - 视频: benchmarks/video.md
            - 参考:
                - CLI: reference/cli.md
                - 配置: reference/configuration.md
                - 支持的模型: reference/models.md
  - search:
      lang:
        - en
        - es
        - fr
        - zh
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            allow_inspection: false
            docstring_options:
              warn_missing_types: false
            docstring_section_style: list
            filters: []
            heading_level: 2
            merge_init_into_class: true
            members_order: source
            separate_signature: true
            show_bases: true
            show_if_no_docstring: true
            show_object_full_path: true
            show_root_full_path: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/accessibility.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/waybarrios/vllm-mlx
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vllm-mlx/

strict: true
